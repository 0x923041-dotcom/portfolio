<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCIDA OS // OPERATOR</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323:wght@400&display=swap');

    :root {
      --green: #00ff41;
      --green-dim: #00c832;
      --green-faint: rgba(0,255,65,0.08);
      --green-mid: rgba(0,255,65,0.18);
      --amber: #ffb300;
      --red: #ff3c3c;
      --bg: #020b04;
      --surface: rgba(0,255,65,0.04);
      --border: rgba(0,255,65,0.15);
      --text: #b8ffca;
      --text-dim: rgba(184,255,202,0.45);
    }

    body.theme-amber {
      --green: #ffb300; --green-dim: #c88c00;
      --green-faint: rgba(255,179,0,0.08); --green-mid: rgba(255,179,0,0.18);
      --text: #fff0b8; --text-dim: rgba(255,240,184,0.45);
      --bg: #0b0800; --border: rgba(255,179,0,0.15);
      --surface: rgba(255,179,0,0.04);
    }

    body.theme-red {
      --green: #ff3c3c; --green-dim: #c82828;
      --green-faint: rgba(255,60,60,0.08); --green-mid: rgba(255,60,60,0.18);
      --text: #ffb8b8; --text-dim: rgba(255,184,184,0.45);
      --bg: #0b0101; --border: rgba(255,60,60,0.15);
      --surface: rgba(255,60,60,0.04);
    }

    body.theme-blue {
      --green: #00e5ff; --green-dim: #00b8c8;
      --green-faint: rgba(0,229,255,0.08); --green-mid: rgba(0,229,255,0.18);
      --text: #b8faff; --text-dim: rgba(184,250,255,0.45);
      --bg: #00090b; --border: rgba(0,229,255,0.15);
      --surface: rgba(0,229,255,0.04);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
      cursor: none !important;
    }

    a, button, [role="button"] {
      cursor: none !important;
    }

    /* Background Grid */
    #grid-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .grid-svg {
      width: 100%;
      height: 100%;
      animation: grid-float 16s ease-in-out infinite alternate;
    }

    @keyframes grid-float {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    /* CRT Overlays */
    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.13) 2px, rgba(0,0,0,0.13) 4px);
      transition: opacity 0.3s ease;
    }

    body.no-scanlines #crt-scanlines {
      opacity: 0;
    }

    #crt-vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.82) 100%);
    }

    /* Custom Cursor */
    #cursor {
      position: fixed;
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--green);
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, border-color 0.3s, box-shadow 0.3s;
    }

    #cursor-dot {
      position: fixed;
      width: 4px;
      height: 4px;
      background: var(--green);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10001;
      transform: translate(-50%, -50%);
      transition: background 0.3s;
    }

    /* Utils */
    .vt323 { font-family: 'VT323', monospace; }
    .share-tech { font-family: 'Share Tech Mono', monospace; }

    /* Boot Overlay */
    #boot-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      z-index: 5000;
      color: var(--green);
      font-family: 'Share Tech Mono', monospace;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      overflow-y: auto;
      transition: opacity 0.6s ease;
    }

    .boot-line {
      min-height: 1.2rem;
      white-space: pre-wrap;
    }

    .boot-ok { color: var(--green); }
    .boot-warn { color: var(--amber); }
    .boot-anomaly { color: var(--amber); text-shadow: 0 0 6px rgba(255,179,0,0.35); }
    .boot-welcome {
      font-family: 'VT323', monospace;
      font-size: 2rem;
      font-weight: bold;
      margin-top: 1rem;
    }

    /* Desktop visibility */
    #desktop {
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #desktop.visible {
      opacity: 1;
    }

    /* Windows */
    #windows-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .window {
      position: absolute;
      background: var(--bg);
      border: 1px solid var(--border);
      box-shadow: 0 0 20px var(--green-faint);
      display: flex;
      flex-direction: column;
      min-width: 200px;
      pointer-events: all;
    }

    .window-header {
      background: var(--green-faint);
      color: var(--green);
      font-family: 'VT323', monospace;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: grab;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .window-header:active {
      cursor: grabbing;
    }

    .window-title {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .window-close {
      cursor: none !important;
      padding: 0 4px;
    }
    .window-close:hover {
      background: var(--red);
      color: white;
    }

    .window-content {
      padding: 12px;
      flex-grow: 1;
      overflow-y: auto;
    }

    /* Desktop Layout */
    #desktop {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10vh;
      z-index: 5;
    }

    #hero-container {
      text-align: center;
      margin-bottom: 2rem;
    }

    .hero-title {
      font-family: 'VT323', monospace;
      font-size: 5rem;
      color: var(--green);
      letter-spacing: 0.15em;
      text-shadow: 0 0 10px var(--green-mid);
      margin: 0;
    }

    .hero-subtitle {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      margin-top: 0.5rem;
      text-transform: uppercase;
    }

    #status-bar {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-bottom: 3rem;
      letter-spacing: 0.1em;
    }

    /* Tile Grid */
    #tile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .tile {
      width: 110px;
      height: 110px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
      cursor: none !important;
    }

    .tile:hover {
      border-color: var(--green);
      box-shadow: 0 0 15px var(--green-faint);
      background: var(--green-faint);
    }

    .tile-icon {
      font-size: 2rem;
      color: var(--green);
    }
    .tile-icon img {
      width: 32px;
      height: 32px;
    }

    .tile-label {
      font-size: 0.7rem;
      color: var(--text);
      text-transform: uppercase;
    }

    /* Corrupted Tiles */
    .tile-red { --green: var(--red); --border: rgba(255, 60, 60, 0.15); }
    .tile-amber { --green: var(--amber); --border: rgba(255, 179, 0, 0.15); }

    .tile-glitch {
      animation: border-flicker 2s infinite;
    }

    /* Override colors for red/amber tiles manually because CSS vars are tricky in keyframes */
    .tile-red.tile-glitch { animation: border-flicker-red 2.3s infinite; }
    .tile-amber.tile-glitch { animation: border-flicker-amber 1.7s infinite; }

    @keyframes border-flicker-red {
      0%, 100%, 12%, 24%, 70% { border-color: rgba(255, 60, 60, 0.15); }
      10%, 22%, 68% { border-color: rgba(255, 60, 60, 0.5); }
    }
    @keyframes border-flicker-amber {
      0%, 100%, 8%, 20%, 60% { border-color: rgba(255, 179, 0, 0.15); }
      6%, 18%, 58% { border-color: rgba(255, 179, 0, 0.5); }
    }

    /* Styx Window Specifics */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: status-pulse 2s infinite;
    }
    @keyframes status-pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 255, 65, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(0, 255, 65, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 255, 65, 0); }
    }

    .description-block {
      font-size: 0.8rem;
      line-height: 1.4;
      color: var(--text);
      margin-bottom: 1.5rem;
    }

    .stack-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 1.5rem;
    }
    .chip {
      border: 1px solid var(--border);
      padding: 2px 6px;
      font-size: 0.65rem;
      color: var(--text-dim);
    }

    .action-button {
      display: block;
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--green);
      text-align: left;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .action-button:hover {
      background: var(--green-faint);
      border-color: var(--green);
      color: var(--text);
      box-shadow: 0 0 10px var(--green-faint);
    }

    /* Radio Window */
    .radio-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .radio-now-playing {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 15px;
      text-align: center;
    }
    .station-name {
      font-family: 'VT323', monospace;
      font-size: 2rem;
      color: var(--green);
      white-space: nowrap;
      overflow: hidden;
      position: relative;
    }
    .station-name.playing::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.1), transparent);
      animation: scanline-pass 2s linear infinite;
    }
    @keyframes scanline-pass {
      to { left: 100%; }
    }

    .radio-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .radio-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 12px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .radio-btn:hover {
      border-color: var(--green);
      color: var(--green);
    }

    .station-list {
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid var(--border);
    }
    .station-item {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-bottom: 1px solid var(--border);
      cursor: none !important;
    }
    .station-item:hover {
      background: var(--green-faint);
    }
    .station-item.active {
      color: var(--green);
      background: var(--green-mid);
    }

    .volume-slider {
      width: 100%;
      -webkit-appearance: none;
      background: var(--border);
      height: 4px;
      outline: none;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--green);
      cursor: none !important;
    }

    /* Interactive Terminal */
    .terminal-output {
      height: 250px;
      overflow-y: auto;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      color: var(--green);
      margin-bottom: 10px;
      padding-right: 5px;
    }
    .terminal-line { margin-bottom: 4px; white-space: pre-wrap; }
    .terminal-line.dim-note { color: var(--text-dim); }
    .terminal-line.root-line { color: var(--red); }
    .terminal-input-container {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .terminal-prompt { color: var(--green); }
    .terminal-prompt.root { color: var(--red); text-shadow: 0 0 8px rgba(255,60,60,0.4); }
    .terminal-input {
      background: transparent;
      border: none;
      color: var(--green);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      outline: none;
      flex-grow: 1;
      caret-color: var(--green);
    }
    .terminal-output::-webkit-scrollbar { width: 4px; }
    .terminal-output::-webkit-scrollbar-track { background: var(--bg); }
    .terminal-output::-webkit-scrollbar-thumb { background: var(--border); }

    /* Control Panel */
    .control-panel-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .cp-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cp-label {
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .theme-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .cp-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      text-align: center;
      transition: all 0.2s;
    }
    .cp-btn:hover {
      border-color: var(--green);
      color: var(--green);
    }
    .cp-btn.active {
      background: var(--green-mid);
      color: var(--green);
      border-color: var(--green);
    }

    /* Taskbar */
    #taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 32px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      justify-content: space-between;
    }

    .taskbar-left { color: var(--text-dim); }
    .taskbar-center { color: var(--text); }
    .taskbar-right { display: flex; gap: 8px; }

    .taskbar-btn {
      background: var(--green-faint);
      border: 1px solid var(--border);
      color: var(--green);
      padding: 2px 8px;
      transition: all 0.2s;
    }
    .taskbar-btn:hover {
      background: var(--green-mid);
      color: var(--text);
    }

    /* Matrix Overlay */
    #matrix-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 8;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    #matrix-overlay.visible {
      opacity: 1;
    }

    /* Snake Game */
    .snake-game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #snake-canvas {
      border: 1px solid var(--border);
      background: #000;
      image-rendering: pixelated;
    }
    .snake-stats {
      font-size: 0.8rem;
      color: var(--green);
      width: 100%;
      display: flex;
      justify-content: space-between;
    }
    .snake-game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(0,0,0,0.85);
      border: 1px solid var(--red);
      padding: 20px;
      color: var(--red);
      font-family: 'VT323', monospace;
      display: none;
    }
    #konami-flash {
      position: fixed;
      inset: 0;
      z-index: 7000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2, 11, 4, 0.95);
      color: var(--green);
      font-family: 'VT323', monospace;
      font-size: clamp(2.8rem, 10vw, 8rem);
      letter-spacing: 0.08em;
      text-align: center;
      text-shadow: 0 0 18px var(--green-mid);
    }
    #konami-flash.active {
      display: flex;
      animation: konamiPulse 1.5s ease;
    }
    @keyframes konamiPulse {
      0% { opacity: 0; transform: scale(1.03); }
      10% { opacity: 1; transform: scale(1); }
      75% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.02); }
    }

  </style>
</head>
<body class="theme-green">
  <!-- Background Grid -->
  <div id="grid-container"></div>

  <!-- Main Content Shell -->
  <div id="desktop">
    <div id="hero-container"></div>
    <div id="status-bar"></div>
    <div id="tile-grid"></div>
  </div>

  <!-- Windows Container -->
  <div id="windows-layer"></div>

  <!-- Taskbar -->
  <div id="taskbar"></div>

  <!-- CRT Overlays -->
  <div id="crt-scanlines"></div>
  <div id="crt-vignette"></div>

  <!-- Custom Cursor -->
  <div id="cursor"></div>
  <div id="cursor-dot"></div>

  <!-- Matrix Overlay -->
  <canvas id="matrix-overlay"></canvas>

  <!-- Boot Animation Overlay -->
  <div id="boot-overlay"></div>
  <div id="konami-flash">ARCHITECT. OPERATOR. BUILDER.</div>

  <script>
    // Grid Background
    const gridContainer = document.getElementById('grid-container');
    gridContainer.innerHTML = `
      <svg class="grid-svg" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--border)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />
      </svg>
    `;

    // Custom Cursor
    const cursor = document.getElementById('cursor');
    const cursorDot = document.getElementById('cursor-dot');
    let mouseX = 0, mouseY = 0;
    let cursorX = 0, cursorY = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursorDot.style.left = mouseX + 'px';
      cursorDot.style.top = mouseY + 'px';
    });

    function animateCursor() {
      const dx = mouseX - cursorX;
      const dy = mouseY - cursorY;
      cursorX += dx * 0.15;
      cursorY += dy * 0.15;
      cursor.style.left = cursorX + 'px';
      cursor.style.top = cursorY + 'px';
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // Boot Animation
    const baseBootLines = [
      { text: "LUCIDA SYSTEMS v2.1.0 — INITIALIZING...", delay: 500 },
      { text: "", delay: 300 },
      { text: "[OK] CPU: 4 OCPU / 24GB RAM — NOMINAL", class: "boot-ok", delay: 200 },
      { text: "[OK] STORAGE: 485GB SOVEREIGN BLOCK STORAGE — MOUNTED", class: "boot-ok", delay: 200 },
      { text: "[OK] AGENT FLEET: ONLINE", class: "boot-ok", delay: 200 },
      { text: "[OK] HARVESTER: RUNNING — INGESTION ACTIVE", class: "boot-ok", delay: 200 },
      { text: "[OK] INTELLIGENCE ARCHIVE: STYX — LIVE", class: "boot-ok", delay: 200 },
      { text: "[OK] NETWORK: SOVEREIGN MESH — STABLE", class: "boot-ok", delay: 200 },
      { text: "[..] CLASSIFIED SERVICES: SIGNAL DEGRADED", class: "boot-warn", delay: 200, glitch: true },
      { text: "[OK] KERNEL: LUCIDA OS — STABLE", class: "boot-ok", delay: 200 },
      { text: "", delay: 500 },
      { text: "> BOOT SEQUENCE COMPLETE.", delay: 300 },
      { text: "> WELCOME, OPERATOR.", class: "boot-welcome", delay: 800 }
    ];

    const bootOverlay = document.getElementById('boot-overlay');
    const desktop = document.getElementById('desktop');

    async function typeLine(lineObj) {
      const lineEl = document.createElement('div');
      lineEl.className = 'boot-line ' + (lineObj.class || '');
      bootOverlay.appendChild(lineEl);
      
      const text = lineObj.text;
      for (let i = 0; i <= text.length; i++) {
        let displayText = text.substring(0, i);
        if (lineObj.glitch && i > 0 && i < text.length) {
          if (Math.random() > 0.8) {
            const chars = "!@#$%^&*()_+-=[]{}|;:,.<>?";
            displayText = displayText.substring(0, i-1) + chars[Math.floor(Math.random() * chars.length)];
          }
        }
        lineEl.textContent = displayText;
        await new Promise(r => setTimeout(r, 40));
      }
      // Resolve glitch for the line
      if (lineObj.glitch) {
        lineEl.textContent = text;
      }
      await new Promise(r => setTimeout(r, lineObj.delay || 0));
    }

    function buildBootLines() {
      const lines = [...baseBootLines];
      if (Math.floor(Math.random() * 10) === 0) {
        lines.splice(9, 0, {
          text: "[??] UNEXPECTED PROCESS: OBSERVER — CANNOT TERMINATE",
          class: "boot-anomaly",
          delay: 200
        });
      }
      return lines;
    }

    async function runBoot() {
      const bootLines = buildBootLines();
      for (const line of bootLines) {
        await typeLine(line);
      }
      await new Promise(r => setTimeout(r, 800));
      bootOverlay.style.opacity = '0';
      setTimeout(() => {
        bootOverlay.style.display = 'none';
        desktop.classList.add('visible');
        // Trigger terminal spawn here later

        this.el = null;
        this.isDragging = false;
        this.dragOffset = { x: 0, y: 0 };
      }

      create() {
        const existing = document.getElementById(this.id);
        if (existing) {
          this.bringToFront(existing);
          return existing;
        }

        const win = document.createElement('div');
        win.id = this.id;
        win.className = 'window';
        win.style.zIndex = ++topZIndex;
        
        const width = this.options.width || 400;
        const height = this.options.height || 'auto';
        win.style.width = typeof width === 'number' ? width + 'px' : width;
        win.style.height = typeof height === 'number' ? height + 'px' : height;

        const startX = this.options.x !== undefined ? this.options.x : (50 + (topZIndex % 20) * 10);
        const startY = this.options.y !== undefined ? this.options.y : (100 + (topZIndex % 20) * 10);

          if (e.target.classList.contains('window-close')) return;
          this.isDragging = true;
          this.bringToFront(win);
          this.dragOffset.x = e.clientX - win.offsetLeft;
          this.dragOffset.y = e.clientY - win.offsetTop;
          document.addEventListener('mousemove', this.onMouseMove);
          document.addEventListener('mouseup', this.onMouseUp);
        });

        win.querySelector('.window-close').addEventListener('click', () => {
          this.close(win);
        });

        win.addEventListener('mousedown', () => {
          this.bringToFront(win);
        });

        windowsLayer.appendChild(win);
        this.el = win;
        return win;
      }

        if (!this.isDragging) return;
        let x = e.clientX - this.dragOffset.x;
        let y = e.clientY - this.dragOffset.y;

        const winWidth = this.el.offsetWidth;
        const winHeight = this.el.offsetHeight;
        x = Math.max(0, Math.min(x, window.innerWidth - winWidth));
        y = Math.max(0, Math.min(y, window.innerHeight - winHeight));

        this.el.style.left = x + 'px';
        this.el.style.top = y + 'px';
      }

        this.isDragging = false;
        document.removeEventListener('mousemove', this.onMouseMove);
